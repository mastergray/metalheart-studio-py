[project]
name = "metalheart-studio"
version = "0.0.0"
description = "Headless JSON-driven audio-reactive Metalheart video renderer"
readme = "README.md"
requires-python = ">=3.8"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test*"]
pythonpath = ["."]
markers = [
    "integration: exercises FFmpeg, caches, adapters, or multi-module assembly",
    "visual: compares deterministic frames or clips with reviewed golden fixtures",
    "slow: exercises full renders, parallel workers, cancellation, or recovery",
]

[tool.coverage.run]
branch = true
source = ["metalheart"]
omit = ["ref/*", "tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.8"
strict = true
exclude = ["^ref/"]

[tool.ruff]
target-version = "py38"
extend-exclude = ["ref"]
