[project]
name = "metalheart-studio"
version = "0.0.0"
description = "Native audio-reactive authoring application and headless Metalheart renderer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24,<2; python_version < '3.9'",
  "numpy>=1.26,<2; python_version >= '3.9'",
  "opencv-python-headless>=4.8,<4.12",
  "Pillow>=10,<12",
  "PySide6>=6.4,<6.7",
  "scipy>=1.10,<2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test*"]
pythonpath = ["."]
markers = [
    "integration: exercises FFmpeg, caches, adapters, or multi-module assembly",
    "visual: compares deterministic frames or clips with reviewed golden fixtures",
    "slow: exercises full renders, parallel workers, cancellation, or recovery",
]

[tool.coverage.run]
branch = true
source = ["metalheart"]
omit = ["ref/*", "tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.8"
strict = true
exclude = ["^ref/"]

[tool.ruff]
target-version = "py38"
extend-exclude = ["ref"]
